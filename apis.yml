aid: duetto-research
name: Duetto Research
description: >-
  Duetto Research is a hospitality technology company whose cloud platform, marketed as Duetto,
  delivers a Revenue & Profit Operating System (RP-OS) for hotels, casinos, and resorts. The
  platform pairs real-time dynamic pricing, demand forecasting, group and block business
  management, and profitability benchmarking so revenue teams can optimize rates and total
  property profit across more than 20,000 properties in over 100 countries. Its marquee products
  include GameChanger (dynamic pricing and rate optimization), ScoreBoard (forecasting and
  reporting), BlockBuster (group business), Advance (AI-driven rate recommendations), GameTime
  (select-service revenue management), and HotStats (profitability benchmarking). Duetto connects
  with the property management systems, booking engines, and channel managers hotels already use
  through a large partner-integration ecosystem rather than a self-serve public developer API.
  Backed by Battery Ventures; surfaced into the API Evangelist network as a portfolio lead.
